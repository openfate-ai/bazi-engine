<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light"><title>OpenFate 八字命盤庫 2.1</title>
<style>
:root{color-scheme:light;--paper:#faf8f2;--ink:#242c26;--muted:#4c5d51;--line:#bdc8ba;--green:#264b3d}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.7 "Work Sans","PingFang TC","Microsoft JhengHei",sans-serif}main{max-width:930px;margin:auto;padding:36px clamp(16px,5vw,58px) 80px}header{border-bottom:2px solid var(--green);margin-bottom:20px}h1,h2,h3{line-height:1.35;text-wrap:balance}h1,h2{font-family:"Source Han Serif TC","Songti TC",serif}h1{font-size:clamp(1.9rem,5vw,3rem);margin:0}header p,.meta{color:var(--muted)}fieldset{border:1px solid var(--line);padding:12px 18px 17px;margin:18px 0}legend{font-weight:700;padding:0 6px}.controls{display:flex;align-items:end;flex-wrap:wrap;gap:9px 14px}label{display:grid;gap:4px;min-width:0}select,input,button{max-width:100%;font:inherit;min-height:44px;border:1px solid var(--muted);border-radius:4px;background:white;color:var(--ink);padding:4px 8px}button{cursor:pointer;background:var(--green);color:white;padding-inline:18px}select:focus-visible,input:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid #90701c;outline-offset:2px}summary{cursor:pointer;color:var(--green);padding:7px 0;min-height:44px}#status{min-height:1.7em;color:var(--muted)}h2{font-size:clamp(1.7rem,5vw,2.5rem)}article section{border-top:1px solid var(--line);padding:11px 0}article p{white-space:pre-line}code{font-size:.9em;overflow-wrap:anywhere}article small{color:var(--muted)}@media(max-width:480px){main{padding-top:20px}fieldset{padding:10px}.controls>*{flex-grow:1}input[type=file]{width:100%}}
summary{overflow-wrap:anywhere}.case{border-top:1px solid var(--line);padding:.55em 0}.case>summary{font-weight:bold}.controls{margin:1rem 0}#chartTitle{margin-bottom:.25em}#reading{margin-top:1.4em}</style></head><body><main><header><h1>OpenFate 八字命盤庫</h1><p>1900 年 1 月 1 日至 2026 年 11 月 22 日 · 1,112,328 組出生樣本 · 成稿 2.1</p></header>
<label>讀一張樣稿<select id="examples"></select></label>
<details id="searchPanel"><summary>從年度檔查盤</summary><form id="search"><fieldset><legend>出生條件</legend>
<p>開啟資料夾 <code>years</code> 裡的年度檔，選擇同一年的日期。每個時辰取一個代表時刻，固定東八區、東經 120 度。</p>
<div class="controls"><label>年度檔（.jsonl.gz）<input id="file" type="file" accept=".gz" required></label>
<label>日期<input id="date" type="date" min="1900-01-01" max="2026-11-22" required></label>
<label>代表時刻<select id="hour"></select></label><label>排運性別<select id="gender"><option value="female">女</option><option value="male">男</option></select></label>
<button type="submit">讀取命盤</button></div></fieldset></form></details>
<p id="status" role="status" aria-live="polite"></p><h2 id="chartTitle"></h2><p id="birthInfo"></p><details><summary>命盤標籤</summary><p id="labels"></p></details><div class="controls"><label>閱讀內容<select id="mode"><option value="book">生活解讀</option><option value="yearbook">逐年對讀</option><option value="technical">排盤與起運</option></select></label><label>章節或年份<select id="chapter"></select></label></div><article id="reading" aria-label="命盤解讀"></article></main>
<script id="samples" type="application/json">__SAMPLE_JSON__</script>
<script>
'use strict';
const get = id => document.getElementById(id);
__RULES__
const samples = JSON.parse(get('samples').textContent);
const topics = __TOPICS_JSON__;
let request = 0;
function node(key, text) { const element = document.createElement(key); element.textContent = text; return element; }
__PANELS__
for (const [i,sample] of samples.entries()) get('examples').add(new Option(sample.name,i));
for(let h=0;h<24;h+=2){const time=String(h).padStart(2,'0')+':30';get('hour').add(new Option(time,time));}
get('examples').addEventListener('change',()=>{request++;show(samples[get('examples').value].row);get('status').textContent='';});
get('file').addEventListener('change',()=>{
  const year=/^(\d{4})\.jsonl\.gz$/.exec(get('file').files[0]?.name ?? '')?.[1];
  if(year && (!get('date').value || !get('date').value.startsWith(year+'-'))) get('date').value=year+'-01-01';
});
async function selectRecord(file,index,job){
  const reader=file.stream().pipeThrough(new DecompressionStream('gzip')).pipeThrough(new TextDecoderStream()).getReader();
  let tail='',position=0;
  try{
    while(job===request){
      const {value,done}=await reader.read();
      if(done) break;
      const lines=(tail+value).split('\n');tail=lines.pop();
      if(index<position+lines.length)return JSON.parse(lines[index-position]);
      position+=lines.length;
    }
  } finally {await reader.cancel().catch(()=>{});reader.releaseLock();}
  throw Error('找不到相符紀錄，請檢查年度檔是否完整。');
}
get('search').addEventListener('submit',async event=>{
  event.preventDefault();const job=++request;
  const file=get('file').files[0], date=get('date').value, time=get('hour').value, gender=get('gender').value, year=date.slice(0,4);
  get('status').textContent='正在讀取年度檔…';
  try{
    if(file.name!==year+'.jsonl.gz')throw Error('所選日期與年度檔不同，請重新選擇。');
    if(!('DecompressionStream' in window) || !('TextDecoderStream' in window))throw Error('這個瀏覽器無法解壓縮。請使用近期版本，或用隨附的 lookup.py。');
    const offset=(Date.parse(date+'T00:00:00Z')-Date.parse(year+'-01-01T00:00:00Z'))/86400000;
    const row=await selectRecord(file,offset*24+Number(time.slice(0,2))+(gender==='male'?1:0),job);
    if(job!==request)return;
    if(row.id!==date+'T'+time+':00+08:00/'+gender)throw Error('紀錄和出生條件不符，請檢查檔案。');
    show(row);get('examples').selectedIndex=-1;get('status').textContent='已從 '+file.name+' 讀取命盤。';
  }catch(error){if(job===request)get('status').textContent=error.message;}
});
show(samples[0].row);
</script></body></html>
