name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version:
          - 20
          - 22

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run build

      - name: Verify package contents
        run: npm publish --dry-run

      - name: Verify packed-package installation
        run: |
          package_tarball=$(npm pack --silent)
          mkdir -p /tmp/openfate-bazi-engine-package-test
          npm install --prefix /tmp/openfate-bazi-engine-package-test "$PWD/$package_tarball"
          node -e "const engine = require('/tmp/openfate-bazi-engine-package-test/node_modules/@openfate/bazi-engine'); if (typeof engine.calculateBaziChart !== 'function') process.exit(1)"
