name: Create GitHub release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[release]') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve package version
        id: package
        run: echo "version=$(node --print "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          gh release view "v${VERSION}" >/dev/null 2>&1 ||
            gh release create "v${VERSION}" \
              --generate-notes \
              --title "v${VERSION} - OpenFate Bazi Engine"
