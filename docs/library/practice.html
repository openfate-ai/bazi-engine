<main><h1>同盤，怎麼起運？</h1>
<p class="intro">1991 年 10 月 18 日 08:30，兩筆樣本的四柱完全相同。只改排運性別，第一步大運就差了將近四年。你能從月柱看出是哪一步改了嗎？</p>
<p>本課採《三命通會》卷二〈論大運〉的順逆取節原則。陰年女盤順行、男盤逆行；陽年反過來。從月柱沿六十甲子順推或逆推一位，便是第一步大運。</p>
